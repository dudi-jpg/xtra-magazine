name: Daily articles

on:
  push:
    # TEMP one-shot trigger: editing THIS file kicks a CI run so we can backfill
    # articles immediately (repo's own ANTHROPIC_API_KEY secret is used). Remove
    # this whole `push:` block right after the backfill run completes.
    branches: [main]
    paths: ['.github/workflows/daily-articles.yml']
  schedule:
    # 05:00 UTC daily ≈ 08:00 Israel (summer) / 07:00 (winter).
    # NOTE: there is deliberately NO wall-clock "gate" step. GitHub delays scheduled
    # runs by up to a few hours, so a guard that checks the *execution* hour never
    # sees 08:00 and silently blocks every run — that is exactly what broke this
    # automation after 2026-07-14 (runs fired ~07:3x/08:4x UTC = 10-11:00 Israel and
    # the gate always returned run=no). A single unconditional daily trigger is
    # robust; the mild winter time drift is cosmetic. Mirrors auto-times-magazine.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many articles to generate'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: daily-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLES_PER_RUN: ${{ github.event.inputs.count || '10' }}
          # ARTICLE_MODEL: claude-opus-4-8   # override here if desired
        run: npm run generate:daily

      - name: Commit & push new articles
        run: |
          git config user.name "xtra Bot"
          git config user.email "info@xtra.co.il"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Daily articles — $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed new articles."
          else
            echo "No changes to commit."
          fi
